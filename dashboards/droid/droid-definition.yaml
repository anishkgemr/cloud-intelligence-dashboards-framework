        CustomNarrative:
          Narrative: "<narrative>\n  <inline font-size=\"22.4px\">&#128200;\_\_Month\
            \ over Month Amortized Cost for\_</inline>\n  <inline font-size=\"22.4px\"\
            >\n    <b>\n      <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \    </b>\n  </inline>\n  <br/>\n  <if condition=\"PeriodOverPeriod.hasData\
            \ = false\" level=\"block\">\n    No Data Available for the month of\n\
            \    <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \  </if>\n  <br/>\n  <br/>\n  <if condition=\"PeriodOverPeriod.hasData\
            \ = true\" level=\"block\">\n    <inline font-size=\"19.2px\">Total RDS\
            \ Amortized Cost for\_</inline>\n    <inline font-size=\"19.2px\">\n \
            \     <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \    </inline>\n    <if condition=\"PeriodOverPeriod.percentDifference.value\
            \ &gt;= 0\" level=\"inline\">\n      <inline color=\"Accent\" font-size=\"\
            19.2px\">\n        <b>\_increased by\_</b>\n      </inline>\n    </if>\n\
            \    <if condition=\"PeriodOverPeriod.percentDifference.value &lt; 0\"\
            \ level=\"inline\">\n      <inline color=\"Accent\" font-size=\"19.2px\"\
            >\n        <b>\_decreased by\_</b>\n      </inline>\n    </if>\n    <inline\
            \ color=\"Accent\" font-size=\"19.2px\">\n      <b>\n        <expression>PeriodOverPeriod.percentDifference.formattedAbsoluteValue</expression>\n\
            \      </b>\n    </inline>\n    <inline color=\"Accent\" font-size=\"\
            19.2px\">\n      <b>\_</b>\n    </inline>\n    <inline color=\"Accent\"\
            \ font-size=\"19.2px\">\n      <b>\n        <expression>PeriodOverPeriod.absoluteDifference.formattedValue</expression>\n\
            \      </b>\n    </inline>\n    <inline font-size=\"19.2px\">\_from\_\
            </inline>\n    <inline font-size=\"19.2px\">\n      <expression>PeriodOverPeriod.previousMetricValue.formattedValue</expression>\n\
            \    </inline>\n    <inline font-size=\"19.2px\">\_to\_</inline>\n   \
            \ <inline font-size=\"19.2px\">\n      <expression>PeriodOverPeriod.currentMetricValue.formattedValue</expression>\n\
            \    </inline>\n    <inline font-size=\"19.2px\">.</inline>\n  </if>\n\
            \  <br/>\n  <br/>\n  <br/>\n  \u2197\uFE0F\n  <inline font-size=\"22.4px\"\
            >Top Movers:</inline>\n  <br/>\n  <if condition=\"TopMovers.itemsCount\
            \ &lt; 1\" level=\"block\">\n    <inline font-size=\"19.2px\">&#128314;\
            \ There is no Top Movers for the Month of\_</inline>\n    <inline font-size=\"\
            19.2px\">\n      <b>\n        <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \      </b>\n    </inline>\n  </if>\n  <br/>\n  <if condition=\"TopMovers.itemsCount\
            \ &gt; 1\" level=\"block\">\n    <inline font-size=\"19.2px\">&#128314;\
            \ There is/are\_\_</inline>\n    <inline font-size=\"19.2px\">\n     \
            \ <b>\n        <expression>TopMovers.itemsCount</expression>\n      </b>\n\
            \    </inline>\n    <inline font-size=\"19.2px\">\_Top Movers for the\
            \ month of\_</inline>\n    <inline font-size=\"19.2px\">\n      <b>\n\
            \        <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \      </b>\n    </inline>\n  </if>\n  <br/>\n  <for level=\"block\" listExpression=\"\
            TopMovers.items\">\n    <ul>\n      <li class=\"ql-indent-0\">\n     \
            \   <inline font-size=\"19.2px\">Account\_</inline>\n        <inline font-size=\"\
            19.2px\">\n          <b>\n            <expression>TopMovers.items[index].categoryValue.value</expression>\n\
            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_spend increased from\_</inline>\n        <inline font-size=\"19.2px\"\
            >\n          <b>\n            <expression>TopMovers.items[index].previousMetricValue.formattedValue</expression>\n\
            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_to\_</inline>\n        <inline font-size=\"19.2px\">\n          <b>\n\
            \            <expression>TopMovers.items[index].currentMetricValue.formattedValue</expression>\n\
            \          </b>\n        </inline>\n        <inline font-size=\"19.2px\"\
            >\_</inline>\n      </li>\n    </ul>\n  </for>\n  <br/>\n  <br/>\n  <br/>\n\
            \  \u2198\uFE0F\n  <inline font-size=\"22.4px\">Bottom Movers:\_</inline>\n\
            \  <br/>\n  <if condition=\"BottomMovers.itemsCount &lt; 1\" level=\"\
            block\">\n    &#128315;\n    <inline font-size=\"19.2px\">\_There is no\
            \ Bottom Movers for the Month of\_</inline>\n    <inline font-size=\"\
            19.2px\">\n      <b>\n        <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \      </b>\n    </inline>\n  </if>\n  <br/>\n  <if condition=\"BottomMovers.itemsCount\
            \ &gt; 1\" level=\"block\">\n    &#128315;\n    <inline font-size=\"19.2px\"\
            >\_There is/are\_</inline>\n    <inline font-size=\"19.2px\">\n      <b>\n\
            \        <expression>BottomMovers.itemsCount</expression>\n      </b>\n\
            \    </inline>\n    <inline font-size=\"19.2px\">\_Bottom Movers for the\
            \ month of\_</inline>\n    <inline font-size=\"19.2px\">\n      <b>\n\
            \        <expression>PeriodOverPeriod.currentTimeValue.formattedValue</expression>\n\
            \      </b>\n    </inline>\n  </if>\n  <br/>\n  <for level=\"block\" listExpression=\"\
            BottomMovers.items\">\n    <ul>\n      <li class=\"ql-indent-0\">\n  \
